services:
  postgres:
    image: postgres:16
    container_name: railway_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: railway_user
      POSTGRES_PASSWORD: railway_password
      POSTGRES_DB: railway_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: